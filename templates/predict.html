<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极氪备件月度销量预测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>极氪备件 SKU 月度销量预测</h1>
            <p class="subtitle">上传全量 SKU 最近 12 个月销量文件，下载未来 3 个月预测结果</p>
        </header>

        <main class="card">
            <h2>上传 SKU 月度销量文件</h2>
            <p class="desc">
                上传 Excel 或 CSV 文件，每行一个 SKU。文件格式：<br>
                <code>SKU编码 | SKU名称 | 月1(最近) | 月2 | ... | 月12(最早)</code><br>
                系统将预测每个 SKU 未来 3 个月销量。
            </p>

            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📤</div>
                <p class="upload-text">拖拽文件到此处，或点击选择文件</p>
                <p class="upload-hint">支持 .csv、.xlsx、.xls 格式</p>
                <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">选择文件</button>
            </div>

            <div class="file-info" id="fileInfo" style="display:none;">
                <span class="file-icon">📄</span>
                <span id="fileName"></span>
                <button class="btn-text" onclick="clearFile()">✕</button>
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn btn-primary" onclick="submitBatch()" id="submitBtn" disabled>
                    批量预测并下载结果
                </button>
            </div>

            <div class="progress" id="progress" style="display:none;">
                <div class="spinner"></div>
                <span id="progressText">正在预测...</span>
            </div>

            <div class="error-box" id="errorBox" style="display:none;"></div>
        </main>

        <footer>
            <p>Powered by <strong>XGBoost</strong> + <strong>Flask</strong> · 混合训练 6,263 SKU · 季节性特征增强</p>
        </footer>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['csv', 'xlsx', 'xls'].includes(ext)) {
                showError('仅支持 .csv、.xlsx、.xls 格式');
                return;
            }
            document.getElementById('fileInfo').style.display = 'flex';
            document.getElementById('fileName').textContent = file.name + ' (' + formatSize(file.size) + ')';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('errorBox').style.display = 'none';
        }

        function clearFile() {
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            fileInput.value = '';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function submitBatch() {
            if (!fileInput.files.length) return;

            const fd = new FormData();
            fd.append('file', fileInput.files[0]);

            document.getElementById('progress').style.display = 'flex';
            document.getElementById('progressText').textContent = '正在预测所有 SKU...';
            document.getElementById('submitBtn').disabled = true;

            fetch('/api/forecast/batch', { method: 'POST', body: fd })
                .then(r => {
                    if (!r.ok) return r.json().then(d => { throw new Error(d.error); });
                    return r.blob();
                })
                .then(blob => {
                    document.getElementById('progress').style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'prediction_result.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                })
                .catch(e => {
                    document.getElementById('progress').style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    showError(e.message);
                });
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.textContent = '❌ ' + msg;
        }
    </script>
</body>
</html>
